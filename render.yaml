services:
  - type: web
    name: projetocric-django
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: DB_ENGINE
        value: django.db.backends.mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*.onrender.com"
