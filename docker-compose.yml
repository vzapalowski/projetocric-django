volumes:
  mysql_data:
  staticfiles:
  mediafiles:
  admin_static:

networks:
  rotacric:
    driver: bridge

services:
  web:
    build: .
    container_name: rotacric-web
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/rotacric
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - rotacric

  db:
    image: mysql:8.0
    container_name: rotacric-db
    restart: unless-stopped
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    networks:
      - rotacric
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
